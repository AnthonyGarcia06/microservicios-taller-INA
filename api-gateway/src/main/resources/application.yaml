server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          # Cada "route" define: id, uri de destino, y predicados (condiciones) de cuando aplicarla.
          # Aqui NO usamos service discovery (Eureka): las URIs apuntan directo a localhost.
          routes:

            - id: ms-usuarios
              uri: http://localhost:8081
              predicates:
                - Path=/api/usuarios/**

            - id: ms-productos
              uri: http://localhost:8082
              predicates:
                - Path=/api/productos/**

            - id: ms-pedidos
              uri: http://localhost:8083
              predicates:
                - Path=/api/pedidos/**

logging:
  level:
    org.springframework.cloud.gateway: debug