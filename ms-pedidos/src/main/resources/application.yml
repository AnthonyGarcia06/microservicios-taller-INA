server:
  port: 8083

spring:
  application:
    name: ms-pedidos

  datasource:
    url: jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=pedidosdb;encrypt=true;trustServerCertificate=true
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: sa
    password: "crpp"

  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ms-productos devuelve el campo "stockBajo" que nuestro ProductoDTO no declara.
  # Sin esto, Jackson tira error al deserializar esa respuesta.
  jackson:
    deserialization:
      fail-on-unknown-properties: false

logging:
  level:
    org.hibernate.SQL: debug

# URLs base de los microservicios de los que depende ms-pedidos.
# Van aca (no quemadas en el codigo Java) para poder cambiarlas sin recompilar.
ms-usuarios:
  url: http://localhost:8081

ms-productos:
  url: http://localhost:8082
